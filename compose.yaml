services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "65532:65532"
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
